<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NextMatch</title>
<meta name="description" content="Pickup basketball and flag football across Texas. Find a game tonight, run the scoreboard, climb your city.">
<meta name="theme-color" content="#0c1217">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NextMatch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='10' cy='10' r='10' fill='%23ff6a2b'/%3E%3Cpath d='M9 0h2v20H9zM0 9h20v2H0z' fill='%230c1217'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">

<body>
<div class="app" id="app" hidden>
  <header class="topbar"><div class="topbar-in">
    <div class="wordmark"><i></i>NextMatch</div>
    <button class="city" id="citybtn" aria-label="Change city" aria-haspopup="dialog">⌖ <span id="cityname">Austin</span> <span aria-hidden="true">▾</span></button>
    <div class="top-actions">
      <button class="icon-btn" id="btn-bell" aria-label="Notifications"></button>
      <button class="icon-btn" id="btn-msg" aria-label="Messages"></button>
    </div>
  </div></header>
  <main class="wrap" id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
<div id="overlay"></div>
<div class="onb" id="gate">
  <div class="court-lines" aria-hidden="true"><svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width="3"><rect x="20" y="20" width="360" height="760"/><line x1="20" y1="400" x2="380" y2="400"/><circle cx="200" cy="400" r="60"/><rect x="140" y="20" width="120" height="190"/><circle cx="200" cy="210" r="60"/><path d="M40 20v120a160 160 0 0 0 320 0V20"/><rect x="140" y="590" width="120" height="190"/><circle cx="200" cy="590" r="60"/><path d="M40 780V660a160 160 0 0 1 320 0v120"/></g></svg></div>
  <div class="onb-in" id="gatebody"><div class="wordmark"><i></i>NextMatch</div><p style="margin-top:20px">Loading…</p></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
